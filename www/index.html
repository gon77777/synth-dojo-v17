<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14202b"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>シンセ道場</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="app">
 <div id="monbar" hidden></div><div id="mstbar" hidden></div><div id="refbar" hidden></div><input type="file" id="reff" accept="audio/*" hidden><input type="file" id="mstf" accept="audio/*" hidden>
 <header id="top">
  <button class="btn" data-act="toc">目次</button>
  <button class="btn" data-act="presets">音色</button>
  <button class="btn" id="synb" data-act="synth">アナログ</button>
  <button class="btn" id="cshow" data-act="coachshow" hidden>解説</button>
  <div class="oct"><button class="btn sm" data-act="octd">◀</button><span id="octl">OCT 0</span><button class="btn sm" data-act="octu">▶</button></div>
  <button class="btn tg" id="holdb" data-act="hold">HOLD</button>
  <button class="btn tg" id="fineb" data-act="fine">FINE</button>
  <canvas id="scope"></canvas>
  <button class="btn sm" data-act="cfg" aria-label="設定">⚙</button>
  <div id="vol"></div>
 </header>
 <main id="main">
  <section id="coach" hidden></section>
  <section id="panel"><nav id="tabs"></nav><div id="grid"></div></section>
 </main>
 <div id="mbar">
  <div class="mseg"><button data-act="mode" data-m="key" class="on">KEY</button><button data-act="mode" data-m="arp">ARP</button><button data-act="mode" data-m="seq">SEQ</button><button data-act="mode" data-m="trk">TRK</button></div>
  <button class="btn tg" id="runb" data-act="run" aria-label="再生/停止">▶</button>
  <div class="bpm" data-pid="sBpm"><button class="btn sm" data-act="bpmd">−</button><b id="bpml">120</b><button class="btn sm" data-act="bpmu">＋</button><button class="btn tg" data-act="tap">TAP</button></div>
  <div id="beat"><i></i><i></i><i></i><i></i></div>
  <button class="btn tg mini" id="midib" data-act="midi" aria-label="MIDI入力" hidden>MIDI</button>
  <button class="btn tg mini" id="kbsb" data-act="kbs" aria-label="鍵盤の大きさ">鍵盤 ▼</button>
 </div>
 <div id="kbd"></div>
</div>
<div id="ov"></div><div id="toast"></div><div id="unsupb" hidden>このシンセは非対応です(この端末ではAudioWorkletが使えません)</div><div id="vload">VOICE MAX</div>
<div id="start"><div class="st"><h1>シンセ道場</h1><p>タップして始める</p></div></div>
<div id="rot">スマホを横向きにしてください</div>
