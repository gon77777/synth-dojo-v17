name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm i --no-save node-web-audio-api@2.2.0
      - run: node test/validate.js
      - run: node test/midi.js
      - run: node test/sched.js
      - run: node test/schedm.js
      - run: node test/wt.js
      - run: node test/seq.js
      - run: node test/meter.js
      - run: node test/loud.js
      - run: node test/mu.js
      - run: node test/bl.js
      - run: node test/ch.js
      - run: node test/rh.js
      - run: node test/me.js
      - run: node test/hm.js
      - run: node test/mf.js
      - run: node test/xmix.js
      - run: node test/xe.js
      - run: node test/xc.js
      - run: node test/xs.js
      - run: node test/xb.js
      - run: node test/xg.js
      - run: node test/xd.js
      - run: node test/lm.js
      - run: node test/snd3.js
      - run: node test/mod.js
      - run: node test/mat.js
      - run: node test/gr.js
      - run: node test/umat.js
      - run: node test/swt.js
      - run: node test/fm.js
      - run: node test/add.js
      - run: node test/fx.js
      - run: node test/mix.js
      - run: node test/voice.js
      - run: node test/eq.js
      - run: node test/cm.js
      - run: node test/ef.js
      - run: node test/pn.js
      - run: node test/fq.js
      - run: node test/vo.js
      - run: node test/mx.js
      - run: node test/se.js
      - run: node test/sc.js
      - run: node test/ms.js
      - run: node test/fxw.js
      - run: node test/fxw-saturator.js
      - run: node test/fxw-doubler.js
      - run: node test/fxw3.js
      - run: node test/fxw4.js
      - run: node test/fxw5.js
      - run: node test/fxw-mbcomp.js
      - run: node test/fxw-pitch.js
      - run: node test/fxw-beat.js
      - run: node test/fxw-reverse.js
      - run: node test/fxw-glitch.js
      - run: node test/fxw-vocoder.js
      - run: node test/fxw-spectral.js
      - run: node test/fxw-meter.js
      - run: node test/lmbus.js
      - run: node test/mr1.js
      - run: node test/oc.js
      - run: node test/lmui.js
      - run: node test/lmgoal.js
      - run: node test/msq.js
      - run: node test/auto.js
      - run: node test/pats.js
      - run: node test/aueq.js
      - run: node test/quality.js
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: アイコン差し替え
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/android/res/* android/app/src/main/res/
      - name: 横向き固定
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: synth-dojo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
